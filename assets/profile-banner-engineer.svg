<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B16"/>
      <stop offset="0.5" stop-color="#0C1A30"/>
      <stop offset="1" stop-color="#0E2233"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="72" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE9D7"/>
      <stop offset="0.55" stop-color="#7CB8FF"/>
      <stop offset="1" stop-color="#B39DFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE9D7"/>
      <stop offset="1" stop-color="#7CB8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop stop-color="#020617" stop-opacity="0"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9FD1F0" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <g>
    <circle cx="180" cy="60" r="220" fill="url(#blob1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 45 -22; 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="280" r="240" fill="url(#blob2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -35 -25; 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="80" r="200" fill="url(#blob3)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 28 20; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="28" fill="url(#vig)"/>

  <g fill="#3D5A75" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">
    <text x="780" y="266">+</text>
    <text x="1108" y="44">+</text>
    <text x="46" y="298">+</text>
  </g>

  <!-- left column -->
  <text x="72" y="96" fill="#7DE9D7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" letter-spacing="0.5">// software engineer, frontend-focused</text>

  <text x="72" y="160" fill="url(#textGrad)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">Eyad Aldaoud</text>
  <rect x="468" y="114" width="7" height="46" rx="3" fill="#7CB8FF">
    <animate attributeName="opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <path d="M72 184H360" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" pathLength="100" style="stroke-dasharray:100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;0" begin="0.4s" dur="1.2s" fill="freeze"/>
  </path>

  <text x="72" y="226" fill="#C4D3E2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="0.2">Designing and building web products end to end —</text>
  <text x="72" y="252" fill="#C4D3E2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" letter-spacing="0.2">responsive interfaces, real integrations, RTL done right.</text>


  <!-- code card -->
  <g>
    <rect x="736" y="64" width="392" height="192" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="762" cy="88" r="5" fill="#FF5F57"/>
    <circle cx="782" cy="88" r="5" fill="#FEBC2E"/>
    <circle cx="802" cy="88" r="5" fill="#28C840"/>
    <text x="932" y="93" fill="#7C93A8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" text-anchor="middle">profile.ts</text>
    <path d="M736 104H1128" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
      <text x="764" y="132"><tspan fill="#C792EA">const</tspan><tspan fill="#E8EEF5"> engineer</tspan><tspan fill="#7C93A8"> = {</tspan></text>
      <text x="764" y="154"><tspan fill="#7C93A8">  </tspan><tspan fill="#9FE8D5">name</tspan><tspan fill="#7C93A8">: </tspan><tspan fill="#7DE9D7">&quot;Eyad Aldaoud&quot;</tspan><tspan fill="#7C93A8">,</tspan></text>
      <text x="764" y="176"><tspan fill="#7C93A8">  </tspan><tspan fill="#9FE8D5">stack</tspan><tspan fill="#7C93A8">: [</tspan><tspan fill="#7DE9D7">&quot;React&quot;</tspan><tspan fill="#7C93A8">, </tspan><tspan fill="#7DE9D7">&quot;Next.js&quot;</tspan><tspan fill="#7C93A8">,</tspan></text>
      <text x="820" y="198"><tspan fill="#7DE9D7">&quot;TypeScript&quot;</tspan><tspan fill="#7C93A8">],</tspan></text>
      <text x="764" y="220"><tspan fill="#7C93A8">  </tspan><tspan fill="#9FE8D5">languages</tspan><tspan fill="#7C93A8">: </tspan><tspan fill="#7DE9D7">&quot;ar / en&quot;</tspan><tspan fill="#7C93A8">,</tspan></text>
      <text x="764" y="242"><tspan fill="#7C93A8">};</tspan></text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="27.5" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
